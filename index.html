function isHoliday(iso) { return PUBLIC_HOLIDAYS.indexOf(iso) !== -1; }
// Gading Serpong: weekend = Jumat, Sabtu, Minggu + libur nasional.
function isGSWeekend(iso) { const d = new Date(iso).getDay(); return d === 5 || d === 6 || d === 0 || isHoliday(iso); }
function slotPriceFor(branch, table, iso) {
    if (branch.id === "bsd")

    if (branch.id === "gs")

    return 50000;

function App() {
    const [step, setStep] = useState(0);
    const [branchId, setBranchId] = useState(null);
    const [tableId, setTableId] = useState(null);
    const [date, setDate] = useState("");

    const [touched, setTouched] = useState(false);
    const [tab, setTab] = useState("info");
    const [booking, setBooking] = useState(null);
    const [copied, setCopied] = useState(false);
    const [bookedHours, setBookedHours] = useState([]);
    const [loadingSlots, setLoadingSlots] = useState(false);
    const [refreshKey, setRefreshKey] = useState(0);
    const [conflict, setConflict] = useState([]);
    const [submitting, setSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState("");
    const [remaining, setRemaining] = useState(0);
    const branch = BRANCHES.find((b) => b.id === branchId) || null;
    const table = branch ? branch.tables.find((t) => t.id === tableId) || null : null;
    const isToday = date === todayISO();
    const nowHour = new Date().getHours();
    const hours = useMemo(() => {
        if (!branch)
            return [];
        const out = [];
        for (let h = branch.open; h < branch.close; h++)
            out.push(h);
        return out;
    }, [branch]);
    const pastHour = (h) => isToday && h <= nowHour;
    const unitPrice = branch && table && date ? slotPriceFor(branch, table, date) : 0;
    const slotTotal = slots.length * unitPrice;
    const addonTotal = ADDONS.reduce((s, a) => s + (addons[a.id] || 0) * a.price, 0);
    const addonCount = ADDONS.reduce((s, a) => s + (addons[a.id] || 0), 0);
    const total = slotTotal + addonTotal;
    useEffect(() => {
        if (!branch || !table || !date) {
            setBookedHours([]);
            return;
        }
        let cancelled = false;
        setLoadingSlots(true);
        fetch(`${API_BASE}/api/availability?branch=${encodeURIComponent(branch.id)}&table=${encodeURIComponent(table.id)}&date=${date}`)
            .then((r) => r.json())
            .then((d) => {
            if (cancelled)
                return;
            const booked = d.bookedHours || [];
            setBookedHours(booked);
            setSlots((s) => s.filter((h) => booked.indexOf(h) === -1 && !pastHour(h)));
        })
            .catch(() => { if (!cancelled)
            setBookedHours([]); })
            .finally(() => { if (!cancelled)
            setLoadingSlots(false); });
        return () => { cancelled = true; };
    }, [tableId, date, refreshKey]);
    // countdown on payment screen
    useEffect(() => {
        if (step !== 4 || !booking || !booking.expiresAt)
            return;
        const tick = () => setRemaining(Math.round((booking.expiresAt - Date.now()) / 1000));
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
    }, [step, booking]);
    const errors = useMemo(() => {
        const e = {};
        if (!form.name.trim())
            e.name = "Nama wajib diisi";
        const phone = form.phone.replace(/[\s-]/g, "");
        if (!phone)
            e.phone = "Nomor WhatsApp wajib diisi";
        else if (!/^(\+?62|0)8\d{7,12}$/.test(phone))
            e.phone = "Contoh: 0812xxxxxxx";
        if (form.email.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.trim()))
            e.email = "Format email tidak valid";
        return e;
    }, [form]);
    const set = (k) => (ev) => setForm((f) => ({ ...f, [k]: ev.target.value }));
    function pickBranch(id) { setBranchId(id); setTableId(null); setSlots([]); setConflict([]); }
    function pickTable(id) { setTableId(id); setSlots([]); setConflict([]); }
    function pickDate(v) { setDate(v); setSlots([]); setConflict([]); }
    function toggleSlot(h) {
        setConflict([]);
        setSlots((s) => (s.indexOf(h) !== -1 ? s.filter((x) => x !== h) : s.concat(h).sort((a, b) => a - b)));
    }
    function bumpAddon(id, d, max) {
        setAddons((a) => ({ ...a, [id]: Math.min(max, Math.max(0, (a[id] || 0) + d)) }));
    }
    const isBooked = (h) => bookedHours.indexOf(h) !== -1;
    const anyFreeTea = branch && date && slots.some((h) => freeIceTea(branch, date, h));
    const canNext = (step === 0 && branch) ||
        (step === 1 && table && date && slots.length > 0) ||
        (step === 2 && Object.keys(errors).length === 0) ||
        step === 3;
    function next() {
        if (step === 2) {
            setTouched(true);
            if (Object.keys(errors).length)
                return;
        }
        if (step < 3)
            setStep((s) => s + 1);
    }
    function back() { setStep((s) => Math.max(0, s - 1)); }
    async function createBooking() {
        const hoursSel = slots.slice();
        const chosenAddons = ADDONS.filter((a) => addons[a.id]).map((a) => ({ name: a.name, qty: addons[a.id], price: a.price }));
        const payload = {
            total, branchId: branch.id, tableId: table.id, branch: branch.name, table: table.name + " · " + table.type,
            date, hours: hoursSel, slots: hoursSel.map(hhmm), duration: hoursSel.length, addons: chosenAddons, ...form,
        };
        setSubmitting(true);
        setSubmitError("");
        try {
            const res = await fetch(`${API_BASE}/api/reservations`, {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            setSubmitting(false);
            if (res.ok && data.ok) {
                setBooking({ ...payload, ...data });
                setStep(4);
                return;
            }
            if (res.status === 409) {
                setConflict(data.conflict || []);
                setSlots([]);
