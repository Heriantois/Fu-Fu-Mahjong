<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Fu Fu Mahjong & Cafe</title>
<style>
  :root{--ink:#1c1a16;--paper:#faf6ec;--card:#fffdf7;--brand:#146c54;--line:#e8e0cf;--muted:#6b6459;--red:#b23a34;--gold:#c2963a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:20px;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .login{max-width:360px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,108,84,.12);}
  .btn{font:inherit;font-weight:700;cursor:pointer;border:1px solid transparent;border-radius:9px;padding:9px 14px;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:#0f5642;}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn.ghost:hover{border-color:#cbbf9f;}
  .btn.danger{background:#fff;border-color:#e6c3bf;color:var(--red);}
  .btn.small{font-size:12.5px;padding:6px 10px;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;}
  .bar .sp{flex:1;}
  .pills{display:flex;gap:6px;}
  .pill{font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;color:var(--muted);}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  th,td{text-align:left;padding:11px 12px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{background:#f3efe3;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  tr:last-child td{border-bottom:none;}
  .amt{font-weight:800;font-variant-numeric:tabular-nums;}
  .code{color:var(--gold);font-weight:800;}
  .muted{color:var(--muted);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .b-pending{background:#fdf3df;color:#8a6d1e;}
  .b-paid{background:#e7f4ed;color:#146c54;}
  .b-expired{background:#efece3;color:#8a847a;}
  .b-cancelled{background:#fbeceb;color:#b23a34;}
  .wa{color:var(--brand);text-decoration:none;font-weight:600;}
  .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .empty{text-align:center;color:var(--muted);padding:40px;}
  .err{color:var(--red);font-size:13px;margin-top:10px;}
  @media(max-width:720px){ table,thead,tbody,th,td,tr{display:block;} thead{display:none;}
    tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);padding:6px 4px;}
    td{border:none;padding:6px 12px;} td::before{content:attr(data-l);color:var(--muted);font-size:11px;display:block;font-weight:700;text-transform:uppercase;} }
.min{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;}
.rvl{display:block;font-size:12px;font-weight:600;margin-bottom:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="login">
    <h1>Admin Fu Fu</h1>
    <div class="sub">Masukkan kunci admin (ADMIN_KEY).</div>
    <input id="key" type="password" placeholder="ADMIN_KEY" />
    <button class="btn primary" style="width:100%;margin-top:12px;" onclick="login()">Masuk</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="dash" style="display:none;">
    <div class="pills" style="margin-bottom:14px;">
      <span class="pill on" id="vw-resv" onclick="showView('resv')">Reservasi</span>
      <span class="pill" id="vw-mem" onclick="showView('mem')">Member</span>
    </div>

    <div id="resvView">
      <h1>Daftar Reservasi</h1>
      <div class="sub" id="counts"></div>
      <div class="bar">
        <div class="pills">
          <span class="pill on" data-f="all" onclick="setFilter('all',this)">Semua</span>
          <span class="pill" data-f="pending" onclick="setFilter('pending',this)">Menunggu</span>
          <span class="pill" data-f="paid" onclick="setFilter('paid',this)">Lunas</span>
        </div>
        <div class="sp"></div>
        <button class="btn ghost small" onclick="load()">↻ Refresh</button>
        <button class="btn ghost small" onclick="logout()">Keluar</button>
      </div>
      <div class="pills" id="branchPills" style="margin-bottom:14px;"></div>
      <div id="tableWrap"></div>
    </div>

    <div id="memView" style="display:none;">
      <h1>Member (Kartu Jam)</h1>
      <div class="sub">Jual kartu atau tambah jam. Member bayar sewa meja pakai jam ini.</div>
      <div class="qr-card" style="text-align:left;max-width:460px;margin-bottom:18px;">
        <div style="font-weight:800;margin-bottom:10px;">Tambah / Top-up member</div>
        <label class="rvl">Nomor WhatsApp</label>
        <input id="m-phone" class="min" placeholder="0812xxxxxxx" />
        <label class="rvl">Nama</label>
        <input id="m-name" class="min" placeholder="Nama member" />
        <label class="rvl">Tier</label>
        <select id="m-tier" class="min"><option value="">—</option><option>Silver</option><option>Gold</option><option>Platinum</option></select>
        <label class="rvl">Tambah jam</label>
        <input id="m-hours" class="min" type="number" placeholder="mis. 10" />
        <div style="display:flex;gap:6px;margin:6px 0 12px;">
          <button class="btn ghost small" onclick="setHours(10,'Silver')">Silver +10</button>
          <button class="btn ghost small" onclick="setHours(20,'Gold')">Gold +20</button>
          <button class="btn ghost small" onclick="setHours(30,'Platinum')">Platinum +30</button>
        </div>
        <button class="btn primary" style="width:100%" onclick="topup()">Simpan / Top-up</button>
        <div id="m-msg" class="sub" style="margin-top:10px;"></div>
      </div>
      <button class="btn ghost small" onclick="loadMembers()" style="margin-bottom:12px;">↻ Refresh member</button>
      <div id="memWrap"></div>
    </div>
  </div>
</div>

<script>
  var KEY = sessionStorage.getItem("fufu_admin_key") || "";
  var FILTER = "all";
  var BRANCHF = sessionStorage.getItem("fufu_branch") || "all";
  var DATA = [];

  function rp(n){ return "Rp" + Number(n||0).toLocaleString("id-ID"); }
  function fmtHours(h){ if(!h) return "-"; return h.split(",").map(function(x){return (x.length<2?"0":"")+x+":00";}).join(", "); }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"});}catch(e){return iso;} }
  function waHref(p){ p=String(p||"").replace(/\D/g,"").replace(/^0/,"62"); return p?("https://wa.me/"+p):null; }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "x-admin-key": KEY }, opts.headers||{});
    var r = await fetch(path, opts);
    return r;
  }

  async function login(){
    KEY = document.getElementById("key").value.trim();
    var r = await api("/api/reservations");
    if(r.status === 401){ document.getElementById("loginErr").textContent = "Kunci salah."; return; }
    sessionStorage.setItem("fufu_admin_key", KEY);
    showDash(); load();
  }
  function logout(){ sessionStorage.removeItem("fufu_admin_key"); KEY=""; location.reload(); }
  function showDash(){ document.getElementById("login").style.display="none"; document.getElementById("dash").style.display="block"; }
  function setFilter(f, el){ FILTER=f; document.querySelectorAll(".bar .pill").forEach(function(p){p.classList.remove("on");}); el.classList.add("on"); render(); }
  function setBranchFilter(name, el){ BRANCHF=name; sessionStorage.setItem("fufu_branch", name); document.querySelectorAll("#branchPills .pill").forEach(function(p){p.classList.remove("on");}); el.classList.add("on"); render(); }

  function showView(v){
    document.getElementById("resvView").style.display = v==="resv"?"block":"none";
    document.getElementById("memView").style.display = v==="mem"?"block":"none";
    document.getElementById("vw-resv").classList.toggle("on", v==="resv");
    document.getElementById("vw-mem").classList.toggle("on", v==="mem");
    if(v==="mem") loadMembers();
  }
  function setHours(h, tier){ document.getElementById("m-hours").value=h; document.getElementById("m-tier").value=tier; }
  async function topup(){
    var phone=document.getElementById("m-phone").value.trim();
    var name=document.getElementById("m-name").value.trim();
    var tier=document.getElementById("m-tier").value;
    var hours=Number(document.getElementById("m-hours").value)||0;
    var msg=document.getElementById("m-msg");
    if(!phone||!hours){ msg.textContent="Isi nomor WhatsApp dan jumlah jam."; return; }
    msg.textContent="Menyimpan…";
    var r=await api("/api/members/topup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:phone,name:name,tier:tier,hours:hours})});
    var j=await r.json();
    if(j.ok){ msg.textContent="Tersimpan. Sisa "+j.member.hoursRemaining+" jam."; document.getElementById("m-phone").value=""; document.getElementById("m-name").value=""; document.getElementById("m-hours").value=""; loadMembers(); }
    else { msg.textContent="Gagal: "+(j.error||"coba lagi"); }
  }
  async function loadMembers(){
    var r=await api("/api/members"); if(r.status===401){logout();return;}
    var j=await r.json(); var m=j.members||[];
    if(!m.length){ document.getElementById("memWrap").innerHTML='<div class="empty">Belum ada member.</div>'; return; }
    var html='<table><thead><tr><th>Nama</th><th>WhatsApp</th><th>Tier</th><th>Sisa Jam</th></tr></thead><tbody>';
    m.forEach(function(x){ html+='<tr><td data-l="Nama">'+(x.name||"-")+'</td><td data-l="WhatsApp">'+x.phone+'</td><td data-l="Tier">'+(x.tier||"-")+'</td><td data-l="Sisa Jam"><b>'+x.hours_remaining+' jam</b></td></tr>'; });
    html+='</tbody></table>';
    document.getElementById("memWrap").innerHTML=html;
  }


  async function load(){
    var r = await api("/api/reservations");
    if(r.status === 401){ logout(); return; }
    var j = await r.json();
    DATA = j.reservations || [];
    render();
  }

  function render(){
    // branch filter pills (built from the data)
    var branches = [];
    DATA.forEach(function(x){ if(x.branch_name && branches.indexOf(x.branch_name)===-1) branches.push(x.branch_name); });
    var bp = '<span class="pill'+(BRANCHF==="all"?" on":"")+'" onclick="setBranchFilter(\'all\',this)">Semua cabang</span>';
    branches.forEach(function(nm){
      bp += '<span class="pill'+(BRANCHF===nm?" on":"")+'" onclick="setBranchFilter(\''+nm.replace(/'/g,"")+'\',this)">'+nm+'</span>';
    });
    document.getElementById("branchPills").innerHTML = bp;

    var scope = DATA.filter(function(x){ return BRANCHF==="all" || x.branch_name===BRANCHF; });
    var pending = scope.filter(function(x){return x.status==="pending";}).length;
    var paid = scope.filter(function(x){return x.status==="paid";}).length;
    var scopeLabel = BRANCHF==="all" ? "" : " · "+BRANCHF;
    document.getElementById("counts").textContent = pending+" menunggu pembayaran · "+paid+" lunas · "+scope.length+" total"+scopeLabel;

    var rows = scope.filter(function(x){ return FILTER==="all" ? true : x.status===FILTER; });
    if(!rows.length){ document.getElementById("tableWrap").innerHTML = '<div class="empty">Belum ada reservasi.</div>'; return; }

    var badge = {pending:["b-pending","Menunggu"],paid:["b-paid","Lunas"],expired:["b-expired","Kadaluarsa"],cancelled:["b-cancelled","Batal"]};
    var html = '<table><thead><tr>'+
      '<th>Tanggal</th><th>Jam</th><th>Cabang / Meja</th><th>Pelanggan</th><th>Nominal</th><th>Status</th><th>Aksi</th>'+
      '</tr></thead><tbody>';
    rows.forEach(function(x){
      var b = badge[x.status] || ["b-expired", x.status];
      var wa = waHref(x.phone);
      var cust = x.name + '<br><span class="muted">'+(x.phone||"")+'</span>' + (wa?' · <a class="wa" href="'+wa+'" target="_blank">WA</a>':'');
      var printLink = '<a class="btn ghost small" href="/invoice/'+x.code+'?key='+encodeURIComponent(KEY)+'" target="_blank">Cetak</a>';
      var acts = "";
      if(x.status==="pending"){
        acts = '<button class="btn primary small" onclick="markPaid(\''+x.code+'\')">Tandai Lunas</button> '+
               '<button class="btn danger small" onclick="cancelBk(\''+x.code+'\')">Batal</button> '+ printLink;
      } else if(x.status==="paid"){
        acts = printLink + ' <button class="btn danger small" onclick="cancelBk(\''+x.code+'\')">Batal</button>';
      } else {
        acts = printLink;
      }
      html += '<tr>'+
        '<td data-l="Tanggal">'+fmtDate(x.date)+'<br><span class="muted">'+x.code+'</span></td>'+
        '<td data-l="Jam">'+fmtHours(x.hours)+'</td>'+
        '<td data-l="Cabang / Meja">'+x.branch_name+(x.kind==="fnb"?' <span class="badge b-paid" style="background:#eef3fb;color:#3457a6">F&B</span>':'')+'<br><span class="muted">'+x.table_name+'</span></td>'+
        '<td data-l="Pelanggan">'+cust+'</td>'+
        '<td data-l="Nominal"><span class="amt">'+rp(x.payable)+'</span><br><span class="muted">kode <span class="code">'+(x.unique_code||"-")+'</span></span></td>'+
        '<td data-l="Status"><span class="badge '+b[0]+'">'+b[1]+'</span></td>'+
        '<td data-l="Aksi"><div class="acts">'+acts+'</div></td>'+
      '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById("tableWrap").innerHTML = html;
  }

  async function markPaid(code){
    if(!confirm("Tandai "+code+" sebagai LUNAS? Invoice akan dikirim ke pelanggan.")) return;
    var r = await api("/api/reservations/"+code+"/pay", {method:"POST"});
    var j = await r.json();
    if(!j.ok){ alert("Gagal: "+(j.error||"coba lagi")); }
    load();
  }
  async function cancelBk(code){
    if(!confirm("Batalkan "+code+"? Meja/jam-nya akan dilepas.")) return;
    await api("/api/reservations/"+code+"/cancel", {method:"POST"});
    load();
  }

  // auto-refresh every 30s while viewing
  setInterval(function(){ if(document.getElementById("dash").style.display!=="none") load(); }, 30000);

  // if we already have a key from this session, go straight in
  if(KEY){ showDash(); load(); }
</script>
</body>
</html>
